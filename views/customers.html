<div class="customers-page">
  <h1 class="page-title">จัดการข้อมูลลูกค้า</h1>
  <p class="customers-subtitle">รายชื่อลูกค้าตามร้านที่เลือกแสดงในหน้าหลัก — ดับเบิลคลิกที่เบอร์เพื่อแก้ไข</p>

  <div class="customers-toolbar">
    <div class="customers-search">
      <i class="bi bi-search"></i>
      <input type="text" id="customers-search" placeholder="ค้นหา ชื่อไลน์ / user / เบอร์โทร / ร้าน" autocomplete="off">

    <button type="button" class="customers-clear-btn" id="customers-clear" title="ล้างคำค้นหา">
      <i class="bi bi-x-circle"></i> ล้าง
    </button>
  </div>

  <div class="customers-card">
    <div class="customers-head" id="customers-head">
      <table class="customers-table">
        <thead>
          <tr>
            <th>ชื่อไลน์</th>
            <th>user</th>
            <th>เบอร์โทร</th>
            <th>จากร้าน</th>
          </tr>
        </thead>
      </table>
    </div>
    <div class="customers-scroll" id="customers-scroll">
      <table class="customers-table">
        <tbody id="customers-body">
          <tr id="cust-loading">
            <td colspan="4">
              <div class="app-loading"><div class="app-spinner"></div>กำลังโหลดข้อมูลลูกค้า...</div>

        </tbody>
      </table>
